# ============================================================
# SonarQube / SonarCloud - Project Configuration
# Proyecto: NewsHub - Portal de Noticias y Comentarios
# ============================================================

# --- Identificadores del Proyecto ---
sonar.projectKey=newshub-portal
sonar.projectName=NewsHub - Portal de Noticias
sonar.projectVersion=1.0

# --- Rutas del Codigo Fuente ---
# Se incluyen tanto el backend Python como el frontend JS
sonar.sources=backend,frontend

# --- Exclusiones ---
# Excluir archivos innecesarios del analisis
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/.venv/**,**/node_modules/**

# --- Configuracion del Lenguaje Python ---
sonar.python.version=3.8,3.9,3.10,3.11,3.12

# --- Codificacion ---
sonar.sourceEncoding=UTF-8

# --- Configuracion del Servidor (solo para SonarQube local) ---
# Descomenta y ajusta si usas SonarQube local:
# sonar.host.url=http://localhost:9000
# sonar.login=tu_token_aqui

# --- Configuracion para SonarCloud ---
# Descomenta y ajusta si usas SonarCloud:
# sonar.host.url=https://sonarcloud.io
# sonar.organization=tu-organizacion
# sonar.login=tu_token_sonarcloud
